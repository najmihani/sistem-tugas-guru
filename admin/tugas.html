<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urus Tugas - Sistem Tugas Guru</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">📋 STG Admin</div>
  <button class="navbar-toggle" onclick="document.querySelector('.navbar-nav').classList.toggle('show')">☰</button>
  <ul class="navbar-nav">
    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="guru.html">👨‍🏫 Guru</a></li>
    <li class="nav-item"><a class="nav-link active" href="tugas.html">📝 Tugas</a></li>
    <li class="nav-item"><a class="nav-link" href="tugasan.html">📌 Tugasan</a></li>
    <li class="nav-item"><a class="nav-link" href="laporan.html">📊 Laporan</a></li>
    <li class="nav-item"><a class="nav-link" href="tetapan.html">⚙️ Tetapan</a></li>
    <li class="nav-item"><a class="nav-link logout-btn" href="#" onclick="stg.logout()">🚪 Log Keluar</a></li>
  </ul>
</nav>

<main class="section">
  <div class="container">

    <div class="page-header d-flex flex-wrap justify-between align-center gap-2">
      <div>
        <h2>📝 Urus Tugas</h2>
        <p>Tambah, kemaskini dan padam data tugas</p>
      </div>
    </div>

    <!-- Add Tugas Form -->
    <div class="card mb-4">
      <div class="card-header">
        <h3>➕ Tambah Tugas Baru</h3>
      </div>
      <div class="card-body">
        <form onsubmit="addNewTugas(event)" class="row" style="gap:0;margin:0;">
          <div class="col-12 col-md-3" style="padding-right:8px;">
            <div class="form-group">
              <label for="tugasNama">Nama Tugas</label>
              <input type="text" id="tugasNama" class="form-control" placeholder="Cth: Guru Kelas" required>
            </div>
          </div>
          <div class="col-12 col-md-2" style="padding:0 8px;">
            <div class="form-group">
              <label for="tugasPoint">Mata (Point)</label>
              <input type="number" id="tugasPoint" class="form-control" placeholder="5" min="1" max="100" required>
            </div>
          </div>
          <div class="col-12 col-md-3" style="padding:0 8px;">
            <div class="form-group">
              <label for="tugasKategori">Kategori</label>
              <select id="tugasKategori" class="form-control" required>
                <option value="">— Pilih —</option>
                <option value="k1">Pentadbiran</option>
                <option value="k2">Kurikulum</option>
                <option value="k3">HEM</option>
                <option value="k4">Kokurikulum</option>
              </select>
            </div>
          </div>
          <div class="col-12 col-md-4" style="padding:0 8px;">
            <div class="form-group">
              <label for="tugasPenerangan">Penerangan</label>
              <input type="text" id="tugasPenerangan" class="form-control" placeholder="Penerangan ringkas" style="min-height:unset;">
            </div>
          </div>
          <div class="col-12" style="padding-left:8px;margin-top:4px;">
            <button type="submit" class="btn btn-primary">➕ Tambah Tugas</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tugas Table -->
    <div class="card">
      <div class="card-header">
        <h3>📋 Senarai Tugas</h3>
        <span class="text-muted" id="tugasCount">0 tugas</span>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table class="table-responsive-mobile" id="tugasTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Nama Tugas</th>
                <th>Mata</th>
                <th>Kategori</th>
                <th>Penerangan</th>
                <th>Bil. Guru</th>
                <th>Tindakan</th>
              </tr>
            </thead>
            <tbody id="tugasTbody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
// === Tugas Management ===

function renderTugas() {
  var list = getTugas();
  var tugasan = getTugasan();
  var tbody = document.getElementById('tugasTbody');
  document.getElementById('tugasCount').textContent = list.length + ' tugas';

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Tiada tugas didaftarkan</td></tr>';
    return;
  }

  var html = '';
  list.forEach(function(t, i) {
    var kategoriNama = stg.kategoriNamaBoleh(t.kategori);
    var kategoriClass = stg.kategoriBadgeClass(t.kategori);
    var bilGuru = tugasan.filter(function(a) { return a.tugasId === t.id; }).length;

    html += '<tr>';
    html += '<td data-label="#">' + (i + 1) + '</td>';
    html += '<td data-label="Nama Tugas"><strong>' + t.nama + '</strong></td>';
    html += '<td data-label="Mata"><span class="badge badge-pt">' + t.point + '</span></td>';
    html += '<td data-label="Kategori"><span class="badge-kategori badge-' + kategoriClass + '">' + kategoriNama + '</span></td>';
    html += '<td data-label="Penerangan"><span class="text-muted">' + (t.penerangan || '—') + '</span></td>';
    html += '<td data-label="Bil. Guru"><span class="badge badge-primary">' + bilGuru + '</span></td>';
    html += '<td data-label="Tindakan">';
    html += '<button class="btn btn-sm btn-danger" onclick="confirmDeleteTugas(\'' + t.id + '\', \'' + t.nama.replace(/'/g, "\\'") + '\')">🗑️ Padam</button>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

function addNewTugas(e) {
  e.preventDefault();
  var nama = document.getElementById('tugasNama').value;
  var point = document.getElementById('tugasPoint').value;
  var kategori = document.getElementById('tugasKategori').value;
  var penerangan = document.getElementById('tugasPenerangan').value;

  if (!nama || !point || !kategori) {
    stg.showFlash('Sila isi ruangan wajib (Nama, Mata, Kategori).', 'danger');
    return;
  }

  var result = addTugas(nama, point, kategori, penerangan);
  if (result) {
    stg.showFlash('Tugas "' + nama + '" (' + point + ' pt) berjaya ditambah!', 'success');
    document.getElementById('tugasNama').value = '';
    document.getElementById('tugasPoint').value = '';
    document.getElementById('tugasKategori').value = '';
    document.getElementById('tugasPenerangan').value = '';
    document.getElementById('tugasNama').focus();
    renderTugas();
  }
}

function confirmDeleteTugas(id, nama) {
  if (!confirm('Anda pasti ingin memadam tugas "' + nama + '"? Semua tugasan berkaitan juga akan dipadam.')) {
    return;
  }
  deleteTugas(id);
  stg.showFlash('Tugas "' + nama + '" telah dipadam.', 'warning');
  renderTugas();
}

// === Init ===
renderTugas();
</script>

</body>
</html>
