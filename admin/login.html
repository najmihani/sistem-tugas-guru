<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk Admin - SMK (P) Jalan Ipoh</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h2>Log Masuk Admin</h2>
      <p>Sistem Pengurusan Tugas Guru</p>
    </div>
    <div class="login-body">
      <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Nama Pengguna</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan nama pengguna" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Kata Laluan</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan kata laluan" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">Log Masuk</button>
      </form>
    </div>
    <div class="login-footer">
      <a href="../index.html">← Kembali ke halaman utama</a>
    </div>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  var username = document.getElementById('username').value;
  var password = document.getElementById('password').value;
  var errorEl = document.getElementById('errorMsg');

  // Hardcoded credentials
  if (username === 'admin' && password === 'admin123') {
    localStorage.setItem('stg_admin', 'true');
    window.location.href = 'index.html';
  } else {
    errorEl.style.display = 'flex';
    errorEl.innerHTML = '❌ Nama pengguna atau kata laluan salah. Sila cuba lagi.';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}
</script>

</body>
</html>
